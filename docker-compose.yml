services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dockerai-backend
    restart: unless-stopped
    # Run as root to access docker socket
    environment:
      - APP_PORT=8080
      - APP_API_KEY=${APP_API_KEY:-}
      - MONGO_URI=${MONGO_URI:-mongodb://admin:changeme_in_production@mongo:27017/?authSource=admin}
      - MONGO_DB=dockerai
      - PROMETHEUS_URL=http://prometheus:9090
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AI_ENDPOINT=${AI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
      - AI_MODEL=${AI_MODEL:-gemini-2.5-flash}
      - AI_API_KEYS=${AI_API_KEYS:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    read_only: false
    depends_on:
      mongo:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  mongo:
    image: mongo:7.0
    container_name: dockerai-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=dockerai
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-changeme_in_production}
    ports:
      - "27018:27017"  # Use different port to avoid conflict
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    security_opt:
      - no-new-privileges:true
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: dockerai-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=10GB
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitor
    depends_on:
      - cadvisor
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dockerai-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3000"
    networks:
      - monitor
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: dockerai-cadvisor
    restart: unless-stopped
    # Use minimal capabilities instead of privileged mode
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    devices:
      - /dev/kmsg:/dev/kmsg
    security_opt:
      - no-new-privileges:true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitor
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API=${VITE_API:-}
        - VITE_API_KEY=${VITE_API_KEY:-}
    container_name: dockerai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - monitor
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Dummy app that constantly throws errors to test AI Logs, Alerts, and Insights
  faulty-app:
    image: alpine:latest
    container_name: dockerai-faulty-app
    command: >
      /bin/sh -c "while true; do 
        echo '[ERROR] Connection refused to database at 10.0.0.5:5432 (timeout 30000ms)'; 
        echo '[FATAL] OutOfMemoryError: Java heap space failed to allocate 2048MB'; 
        echo '[WARN] Connection pool exhausted, unable to process incoming requests';
        echo '[ERROR] NullPointerException in UserAuthService.authenticate()';
        sleep 5; 
      done"
    restart: unless-stopped
    networks:
      - monitor
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M

volumes:
  mongo_data:
    driver: local
    labels:
      - "com.dockerai.volume=mongo"
  mongo_config:
    driver: local
    labels:
      - "com.dockerai.volume=mongo-config"
  prometheus_data:
    driver: local
    labels:
      - "com.dockerai.volume=prometheus"
  grafana_data:
    driver: local
    labels:
      - "com.dockerai.volume=grafana"

networks:
  monitor:
    driver: bridge
